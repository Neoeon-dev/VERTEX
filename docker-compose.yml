services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mailtrace
      POSTGRES_PASSWORD: mailtrace
      POSTGRES_DB: mailtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  pgdata: